<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLEPREFIX}}Sign in – Recorder – rec.example.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161616">
  <link rel="preload" href="/__turnstile/rec/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/__turnstile/rec/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/__turnstile/rec/logo.svg?v={{V}}" type="image/svg+xml">
  <link rel="stylesheet" href="/__turnstile/rec/carbon.css?v={{V}}">
  <link rel="stylesheet" href="/__turnstile/rec/rec.css?v={{V}}">
</head>
<body>
  <a class="cds--skip-to-content" href="#main-content">Skip to main content</a>

  <header class="cds--header rec-header" data-theme="g100" aria-label="Recorder">
    <a class="cds--header__name rec-header__name" href="/">
      <img class="rec-header__mark" src="/__turnstile/rec/logo.svg?v={{V}}" width="20" height="20" alt="">
      Recorder
    </a>
  </header>

  <main class="rec-main" id="main-content">
    <div class="rec-panel">
      <img class="rec-panel__mark" src="/__turnstile/rec/logo.svg?v={{V}}" width="48" height="48" alt="">
      <h1 class="rec-heading">Sign in to Recorder</h1>
      <p class="rec-lede">Use the username and password set for this recorder.</p>
{{BANNER}}{{ERRORSUMMARY}}
      <form class="rec-form" method="post" action="/__turnstile/login" novalidate>
        <input type="hidden" name="r" value="{{R}}">

        <div class="cds--form-item cds--text-input-wrapper">
          <div class="cds--text-input__label-wrapper">
            <label class="cds--label" for="username">Username</label>
          </div>
          <div class="cds--text-input__field-outer-wrapper">
            <div class="cds--text-input__field-wrapper"{{USERWRAP}}>
{{USERICON}}              <input class="cds--text-input cds--layout--size-lg{{USERINPUT}}" id="username" name="username" type="text" value="{{USERNAME}}" spellcheck="false" autocomplete="username" autocapitalize="none"{{USERDESC}}>
            </div>
{{USERERROR}}          </div>
        </div>

        <div class="cds--form-item cds--text-input-wrapper cds--password-input-wrapper">
          <div class="cds--text-input__label-wrapper">
            <label class="cds--label" for="password">Password</label>
          </div>
          <div class="cds--text-input__field-outer-wrapper">
            <div class="cds--text-input__field-wrapper"{{PASSWRAP}}>
{{PASSICON}}              <input class="cds--text-input cds--password-input cds--layout--size-lg{{PASSINPUT}}" id="password" name="password" type="password" spellcheck="false" autocomplete="current-password" autocapitalize="none"{{PASSDESC}}>
              <span class="cds--toggle-password-tooltip">
                <button type="button" class="cds--btn cds--btn--icon-only cds--text-input--password__visibility__toggle cds--tooltip__trigger rec-toggle" aria-controls="password" aria-label="Show password" hidden>
                  <svg class="rec-toggle__show" focusable="false" aria-hidden="true" width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M30.94,15.66A16.69,16.69,0,0,0,16,5,16.69,16.69,0,0,0,1.06,15.66a1,1,0,0,0,0,.68A16.69,16.69,0,0,0,16,27,16.69,16.69,0,0,0,30.94,16.34,1,1,0,0,0,30.94,15.66ZM16,25c-5.3,0-10.9-3.93-12.93-9C5.1,10.93,10.7,7,16,7s10.9,3.93,12.93,9C26.9,21.07,21.3,25,16,25Z"/><path d="M16,10a6,6,0,1,0,6,6A6,6,0,0,0,16,10Zm0,10a4,4,0,1,1,4-4A4,4,0,0,1,16,20Z"/></svg>
                  <svg class="rec-toggle__hide" focusable="false" aria-hidden="true" width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M5.24,22.51l1.43-1.42A14.06,14.06,0,0,1,3.07,16C5.1,10.93,10.7,7,16,7a12.38,12.38,0,0,1,4,.72l1.55-1.56A14.72,14.72,0,0,0,16,5,16.69,16.69,0,0,0,1.06,15.66a1,1,0,0,0,0,.68A16,16,0,0,0,5.24,22.51Z"/><path d="M12,15.73a4,4,0,0,1,3.7-3.7l1.81-1.82a6,6,0,0,0-7.33,7.33Z"/><path d="M30.94,15.66A16.4,16.4,0,0,0,25.2,8.22L30,3.41,28.59,2,2,28.59,3.41,30l5.1-5.1A15.29,15.29,0,0,0,16,27,16.69,16.69,0,0,0,30.94,16.34,1,1,0,0,0,30.94,15.66ZM20,16a4,4,0,0,1-6,3.44L19.44,14A4,4,0,0,1,20,16Zm-4,9a13.05,13.05,0,0,1-6-1.58l2.54-2.54a6,6,0,0,0,8.35-8.35l2.87-2.87A14.54,14.54,0,0,1,28.93,16C26.9,21.07,21.3,25,16,25Z"/></svg>
                </button>
              </span>
            </div>
{{PASSERROR}}          </div>
        </div>

        <div class="cds--form-item rec-security{{TSGROUP}}" id="security-check">
          <p class="cds--label" id="security-check-label">Security check</p>
          <div class="cf-turnstile rec-turnstile" data-sitekey="{{SITEKEY}}" data-size="flexible" data-action="rec-login" data-theme="light" data-language="en" data-response-field-name="cf-turnstile-response"></div>
{{TSERROR}}          <noscript><p class="cds--form__helper-text">Turn on JavaScript to complete the security check.</p></noscript>
        </div>

        <div class="cds--form-item cds--checkbox-wrapper">
          <input class="cds--checkbox" id="remember" name="remember" type="checkbox" value="1"{{REMEMBER}}>
          <label class="cds--checkbox-label" for="remember"><span class="cds--checkbox-label-text">Keep me signed in on this device for 30 days</span></label>
        </div>

        <button type="submit" class="cds--btn cds--btn--primary cds--layout--size-lg rec-submit">
          Sign in
          <svg class="cds--btn__icon" focusable="false" aria-hidden="true" width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><polygon points="18 6 16.57 7.393 24.15 15 4 15 4 17 24.15 17 16.57 24.573 18 26 28 16 18 6"/></svg>
        </button>
      </form>

      <footer class="rec-footer">
        <p>Private service. Recordings by BililiveRecorder. · <a class="rec-footer__link" href="https://rec-status.example.com/privacy">Privacy Policy</a></p>
      </footer>
    </div>
  </main>

  <script src="/__turnstile/rec/login.js?v={{V}}"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
