# Internal subrequest target for Turnstile Siteverify (used by turnstile.lua).
location = /__turnstile_siteverify {
    internal;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $ts_verify_host challenges.cloudflare.com;
    proxy_pass https://$ts_verify_host/turnstile/v0/siteverify;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_set_header Host challenges.cloudflare.com;
    proxy_set_header Content-Type application/x-www-form-urlencoded;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name challenges.cloudflare.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# Static Turnstile assets (gate page, OpenList login script).
location ^~ /__turnstile/ {
    alias /www/common/turnstile/public/;
    add_header Cache-Control "no-cache";
}
