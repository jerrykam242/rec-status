# Sign-in page in front of BililiveRecorder (hand-made; see /www/common/turnstile/README).
# Every request needs the session cookie from /__turnstile/login; nginx then sends the
# recorder's Basic auth header itself, so browsers never get a Basic-auth prompt.
rewrite_by_lua_file /www/common/turnstile/rec_gate.lua;
proxy_hide_header WWW-Authenticate;

# IBM Carbon theme for the recorder's own pages (/, /ui/, /file/, /player/): theme.css plus
# shell.js (header, Sign out, theme switch) go right after <meta charset>, so the theme is set
# before first paint. The recorder is not modified. Bump ?v= after editing either file.
set $rec_theme "";
if ($uri ~ "^/(ui/.*|file/.*|player/.*)?$") {
    set $rec_theme '<link rel="stylesheet" href="/__turnstile/rec/theme.css?v=2"><script src="/__turnstile/rec/shell.js?v=2"></script>';
}
# Switched off automatically when a recorder update no longer fits the theme
# (tools/rec-theme-check); the pages then show the recorder's original look.
if (-f /www/common/turnstile/rec-theme.off) {
    set $rec_theme "";
}
# sub_filter matches case-insensitively: "<meta charset=utf-8>" (/, /player/), "=UTF-8" (/file/).
sub_filter '<meta charset="UTF-8">' '<meta charset="UTF-8">$rec_theme';
sub_filter '<meta charset=UTF-8>' '<meta charset=UTF-8>$rec_theme';
# Every other recorder page (Swagger, GraphiQL, ...) keeps the floating "Sign out" button;
# on themed pages shell.js runs once and puts Sign out in the header instead.
sub_filter '</html>' '<script src="/__turnstile/rec/shell.js?v=2" defer></script></html>';
sub_filter_once on;
# The WebUI (/ui/) sends "text/html; encoding=utf-8", which nginx does not count as text/html.
sub_filter_types "text/html; encoding=utf-8";
# rec_gate.lua strips Accept-Encoding on HTML requests so the body stays plain for sub_filter.

# /file/ directory listings come with no Content-Type at all, so sub_filter would skip them.
header_filter_by_lua_block {
    if ngx.status == 200 then
        local ct = ngx.header.content_type
        if ct == nil or ct == "" or ct == "application/octet-stream" then
            local u = ngx.var.uri or ""
            if u:sub(1, 6) == "/file/" and u:sub(-1) == "/" then
                ngx.header.content_type = "text/html; charset=utf-8"
            end
        end
    end
}

location = /__turnstile/login {
    content_by_lua_file /www/common/turnstile/rec_login.lua;
}

location = /__turnstile/logout {
    content_by_lua_file /www/common/turnstile/rec_logout.lua;
}

# Old Turnstile-only gate page.
location = /__turnstile/gate.html {
    return 301 /__turnstile/login;
}

include /www/common/turnstile/sites/siteverify.conf;
