# Cloudflare Turnstile on the OpenList login (hand-made; see /www/common/turnstile/README).
# Inject the widget script into OpenList's HTML shell.
sub_filter '<meta name="generator" content="OpenList" >' '<meta name="generator" content="OpenList" ><script src="/__turnstile/openlist.js?v=6" defer></script>';
sub_filter_once on;

# Require a valid token on /api/auth/login*.
rewrite_by_lua_file /www/common/turnstile/file_gate.lua;

include /www/common/turnstile/sites/siteverify.conf;

# Turnstile check for rec-status.example.com's sign-in, called by that server (HMAC-signed).
location = /__turnstile/rs-verify {
    client_max_body_size 4k;
    content_by_lua_file /www/common/turnstile/rs_verify.lua;
}
