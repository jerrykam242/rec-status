<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>人机验证 – 录播状态</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161616">
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/assets/logo.svg?v={{V}}" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/carbon.css?v={{V}}">
  <link rel="stylesheet" href="/assets/gate.css?v={{V}}">
  <link rel="stylesheet" href="/assets/cookie.css?v={{V}}">
</head>
<body>
  <a class="cds--skip-to-content" href="#main-content">跳到主要内容</a>

  <header class="cds--header rec-header" data-theme="g100" aria-label="录播状态">
    <a class="cds--header__name rec-header__name" href="/">
      <img class="rec-header__mark" src="/assets/logo.svg?v={{V}}" width="20" height="20" alt="">
      录播状态
    </a>
  </header>

  <main class="rec-main" id="main-content">
    <div class="rec-panel">
      <img class="rec-panel__mark" src="/assets/logo.svg?v={{V}}" width="48" height="48" alt="">
      <h1 class="rec-heading">录播状态</h1>
      <p class="rec-lede">查看录播机正在录制哪个直播间。正在进行安全验证，通过后将自动进入。</p>

      <div class="cds--inline-notification cds--inline-notification--low-contrast cds--inline-notification--error rec-notification" id="gate-error" role="alert" hidden>
        <div class="cds--inline-notification__details">
          <svg class="cds--inline-notification__icon" focusable="false" aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10,1c-5,0-9,4-9,9s4,9,9,9s9-4,9-9S15,1,10,1z M13.5,14.5l-8-8l1-1l8,8L13.5,14.5z"/><path d="M13.5,14.5l-8-8l1-1l8,8L13.5,14.5z" data-icon-path="inner-path" opacity="0"/></svg>
          <div class="cds--inline-notification__text-wrapper">
            <div class="cds--inline-notification__title">验证没有通过</div>
            <div class="cds--inline-notification__subtitle" id="gate-error-text">请重试。</div>
          </div>
        </div>
      </div>

      <form class="rec-form" id="gate-form" action="/__gate/verify" method="post" novalidate data-r="{{R}}">
        <div class="cds--form-item rec-security" id="security-check">
          <p class="cds--label" id="security-check-label">人机验证</p>
          <div class="cf-turnstile rec-turnstile" id="captcha-element" aria-labelledby="security-check-label"
               data-sitekey="YOUR_TURNSTILE_SITEKEY" data-action="rec-status" data-size="flexible"
               data-language="zh-cn" data-callback="recStatusPass" data-error-callback="recStatusError"
               data-expired-callback="recStatusExpired"></div>
          <p class="cds--form__helper-text rec-captcha-status" id="captcha-status" aria-live="polite">正在加载安全验证…</p>
          <noscript><p class="cds--form__helper-text">请开启 JavaScript 以完成人机验证。</p></noscript>
        </div>

        <button type="button" class="cds--btn cds--btn--primary cds--layout--size-lg rec-submit" id="gate-submit">
          进入状态页
          <svg class="cds--btn__icon" focusable="false" aria-hidden="true" width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><polygon points="18 6 16.57 7.393 24.15 15 4 15 4 17 24.15 17 16.57 24.573 18 26 28 16 18 6"/></svg>
        </button>
      </form>

      <footer class="rec-footer">
        <p><a class="cds--link rec-footer__link" href="/privacy">隐私政策 / Privacy Policy</a> · © 2026 Site operator</p>
      </footer>
    </div>
  </main>

  <script src="/assets/cookie.js?v={{V}}" defer></script>
  <script src="/assets/gate.js?v={{V}}"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
