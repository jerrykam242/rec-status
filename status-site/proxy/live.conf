# Live recorder status page (hand-made; see /www/sites/live/gate/README).
# Every request passes gate.lua (rewrite phase, so 1Panel's WAF in the access phase is untouched):
# ESA edge header required, then the captcha session cookie except for the sign-in page,
# its assets and the agent's signed ingest endpoint.
rewrite_by_lua_file /www/sites/live/gate/gate.lua;
absolute_redirect off;  # relative Location headers, whatever scheme ESA uses to reach us

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;

location = /__gate/login  { content_by_lua_file /www/sites/live/gate/login.lua; }
location = /__gate/verify { client_max_body_size 4k; content_by_lua_file /www/sites/live/gate/verify.lua; }
location = /__gate/check  { client_max_body_size 4k; content_by_lua_file /www/sites/live/gate/ts_verify.lua; }
# Turnstile token check on the recorder host (ts_verify.lua; the secret stays there).
location = /__ts_check {
    internal;
    resolver 223.5.5.5 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $ts_check_host file.example.com;
    proxy_pass https://$ts_check_host/__turnstile/rs-verify;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_set_header Host file.example.com;
    proxy_set_header Content-Type application/x-www-form-urlencoded;
    proxy_set_header X-RS-Ts $arg_ts;
    proxy_set_header X-RS-Sig $arg_sig;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name file.example.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}
location = /__gate/logout { content_by_lua_file /www/sites/live/gate/logout.lua; }
location = /__ingest      { client_max_body_size 256k; client_body_buffer_size 256k;
                            content_by_lua_file /www/sites/live/gate/ingest.lua; }
location = /api/status    { content_by_lua_file /www/sites/live/gate/status.lua; }
location = /api/archive   { content_by_lua_file /www/sites/live/gate/archive.lua; }
location = /api/request   { client_max_body_size 4k; content_by_lua_file /www/sites/live/gate/request.lua; }
location = /api/request/status { content_by_lua_file /www/sites/live/gate/request_status.lua; }
location = /__agent/sync  { client_max_body_size 256k; client_body_buffer_size 256k;
                            content_by_lua_file /www/sites/live/gate/agent.lua; }
location = /__admin/review { client_max_body_size 1k; content_by_lua_file /www/sites/live/gate/review.lua; }

# The status page itself: never cached (it sits behind the session check).
location = / {
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /index.html =404;
}
location = /index.html { return 301 /; }

# Privacy policy: public (no captcha), static.
location = /privacy {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    default_type "text/html; charset=utf-8";
    try_files /privacy.html =404;
}
location = /privacy.html { return 301 /privacy; }

# Static assets (fonts, CSS, JS, images); versioned with ?v=.
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
