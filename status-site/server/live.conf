# Live recorder status page (hand-made, not created in 1Panel; see /www/sites/live/gate/README).
# Visitors reach it only through Aliyun ESA (gate.lua checks the ESA edge header).
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name rec-status.example.com;

    root /www/sites/live/index;
    index index.html;
    access_log /www/sites/live/log/access.log;
    error_log /www/sites/live/log/error.log;

    # *.example.com certificate that 1Panel renews for the e5 site (same wildcard).
    ssl_certificate /www/sites/e5/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/e5/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    include /www/sites/live/proxy/*.conf;

    location / {
        return 404;
    }
}
